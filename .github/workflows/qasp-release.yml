# QASP - portable Windows build + GitHub Release
#
# QASP is an unofficial fork of OpenVSP (NASA NOSA 1.3). See MODIFICATIONS.md.
#
# Produces a portable ("unpacked") Windows x64 build: download, extract, run.
# No installer or single-file bundle; keep supporting files together.
#
# Triggers:
#   - push to main or qasp        -> build + upload artifacts (no release)
#   - tag matching v*             -> build + publish a GitHub Release
#   - manual dispatch              -> build + upload artifacts

name: QASP Build

on:
  push:
    branches: [ main, qasp ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Publish a GitHub Release from this run'
        type: boolean
        default: false
      update_existing_release:
        description: 'Existing release tag to update in place; never creates a release or tag'
        type: string
        default: ''

permissions:
  contents: write

# Keep an already-running portable build; do not cancel it for a later dispatch.
concurrency:
  group: qasp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  help-checks:
    name: Help and workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate an in-place release update target
        if: github.event_name == 'workflow_dispatch' && inputs.update_existing_release != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.update_existing_release }}
        run: gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url

      - name: Install native test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ cmake unzip xvfb xauth fonts-dejavu-core \
            libx11-dev libxext-dev libxft-dev libxrender-dev libfontconfig1-dev

      - name: Build the bundled FLTK for focused GUI tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qasp-fltk-source"
          unzip -q Libraries/fltk-6336959306e0.zip -d "$RUNNER_TEMP/qasp-fltk-source"
          FLTK_SOURCE=$(find "$RUNNER_TEMP/qasp-fltk-source" -mindepth 1 -maxdepth 1 -type d | head -1)
          cmake -S "$FLTK_SOURCE" -B "$RUNNER_TEMP/qasp-fltk-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLTK_BUILD_TEST=OFF -DFLTK_BUILD_EXAMPLES=OFF \
            -DFLTK_BUILD_FLUID=OFF -DFLTK_BUILD_GL=OFF \
            -DFLTK_BUILD_SHARED_LIBS=OFF -DFLTK_BACKEND_WAYLAND=OFF
          cmake --build "$RUNNER_TEMP/qasp-fltk-build" --target fltk -j 2
          echo "FLTK_CONFIG=$RUNNER_TEMP/qasp-fltk-build/fltk-config" >> "$GITHUB_ENV"

      - name: Check copy, matching, rebinding and the actual guide window
        run: bash tools/run_qasp_help_checks.sh

      - name: Check independent projects and the actual workspace widgets
        run: bash tools/run_qasp_workspace_checks.sh

  build-windows:
    name: Windows x64 portable
    needs: help-checks
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install cmake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Install dependencies
        shell: cmd
        run: |
          choco install -y swig pandoc
          pip install --upgrade pip setuptools wheel
          pip install sphinx numpy

      - name: Cache bundled Windows dependencies
        uses: actions/cache@v4
        with:
          path: buildlibs
          key: qasp-msvc-v143-${{ runner.os }}-${{ hashFiles('Libraries/CMakeLists.txt', 'Libraries/cmake/**', 'Libraries/*.zip') }}

      - name: Build bundled libraries
        shell: bash
        run: |
          mkdir -p build buildlibs artifacts
          cd "$GITHUB_WORKSPACE/buildlibs"
          cmake -DCMAKE_BUILD_TYPE=Release -A x64 ../Libraries
          cmake --build . --config Release -j 2

      - name: Build QASP
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/build"
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DVSP_CPACK_GEN=ZIP \
                -DVSP_LIBRARY_PATH="$GITHUB_WORKSPACE/buildlibs" \
                -A x64 ../src
          cmake --build . --target package --config Release -j 2

      - name: Collect portable package and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build"
          ls -la *.zip

          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          VSPVER=$(basename $(ls QASP-*.zip | head -1) | cut -d- -f2)

          OUT="QASP-${VSPVER}-Windows-x64-portable_${SHORT_SHA}.zip"
          cp $(ls QASP-*.zip | head -1) "$OUT"
          python "$GITHUB_WORKSPACE/tools/verify_qasp_windows_package.py" "$OUT" \
            --source "$GITHUB_SHA" --stamp

          # Extract so the release also carries the raw unpacked tree.
          mkdir -p unpacked
          unzip -q "$OUT" -d unpacked

          echo "VSPVER=${VSPVER}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

          cp "$OUT" "$GITHUB_WORKSPACE/artifacts"
          (cd "$GITHUB_WORKSPACE/artifacts" && sha256sum *.zip > SHA256SUMS.txt)
          cat "$GITHUB_WORKSPACE/artifacts/SHA256SUMS.txt"

      - name: Verify the executable was produced
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build/unpacked"
          echo "--- package root ---"
          ls -la
          echo "--- searching for vsp.exe ---"
          find . -iname 'vsp.exe' -o -iname 'vspscript.exe' | head
          VSP_EXE=$(find . -iname 'vsp.exe' | head -1)
          if [ -z "$VSP_EXE" ]; then
            echo "ERROR: vsp.exe not found in package - packaging is broken."
            exit 1
          fi
          echo "OK: found $VSP_EXE ($(stat -c%s "$VSP_EXE") bytes)"
          echo "DLL count: $(find . -iname '*.dll' | wc -l)"

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: QASP-Windows-x64-portable
          path: |
            ${{ github.workspace }}/artifacts/*.zip
            ${{ github.workspace }}/artifacts/SHA256SUMS.txt
          retention-days: 30

  release:
    name: Publish Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v') || inputs.make_release == true || (github.event_name == 'workflow_dispatch' && inputs.update_existing_release != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout matching build source
        uses: actions/checkout@v4

      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: QASP-Windows-x64-portable
          path: dist

      - name: Show contents
        run: ls -la dist

      - name: Back up the existing release before replacement
        if: github.event_name == 'workflow_dispatch' && inputs.update_existing_release != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.update_existing_release }}
        run: |
          mkdir -p before-update
          gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,body,url,assets > before-update/release.json
          gh release download "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'QASP-*-Windows-x64-portable_*.zip' --pattern SHA256SUMS.txt \
            --dir before-update

      - name: Retain rollback copy of previous release assets
        if: github.event_name == 'workflow_dispatch' && inputs.update_existing_release != ''
        uses: actions/upload-artifact@v4
        with:
          name: QASP-before-existing-release-refresh
          path: before-update/
          compression-level: 0
          retention-days: 30

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXISTING_RELEASE: ${{ inputs.update_existing_release }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS.txt)
          python3 tools/verify_qasp_windows_package.py dist/QASP-*.zip --source "$GITHUB_SHA"

          # Derive a version string for the title/notes.
          ZIPFILE=$(ls dist/QASP-*.zip | head -1)
          echo "Attaching: $ZIPFILE"

          TAG="$GITHUB_REF_NAME"
          if [[ -n "$EXISTING_RELEASE" ]]; then
            TAG="$EXISTING_RELEASE"
            # Refuse a missing target. This path MUST NOT create a release/tag.
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
          elif [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            TAG="qasp-build-$(date -u +%Y%m%d-%H%M%S)"
          fi

          cat > notes.md <<'EOF'
          ## QASP — Aircraft Design Studio

          **Unofficial fork of OpenVSP.** Not affiliated with, endorsed, or supported
          by NASA or the OpenVSP development team.

          ### Download
          `QASP-*-Windows-x64-portable.zip` — **portable build**.
          Extract anywhere and run `vsp.exe`. No installer or single-file bundle.
          Keep the tools and DLLs together. Delete the program folder to remove
          the application; saved models/preferences may be stored elsewhere.

          Verify the download against `SHA256SUMS.txt`.

          ### Workspace update
          - Left activity icons open/hide resizable panels; the component tree
            and geometry editors are hosted in the main workspace.
          - Snapshot-backed project tabs preserve separate model working copies.
            Only one engine is active; switching clears generated results/mesh
            previews, undo history and the clipboard. Export results first.
          - Automatic fit on component creation, a sidebar hidden on startup,
            compact toolbar and 18-pixel filename/status strip.
          - Staged saves, disk-conflict checks and explicit practical risks.
          - Existing 23 illustrated lessons and 135 authored hover explanations
            are retained. Advanced controls still have coverage limitations.

          ### Validation and limitations
          Experimental workspace changes: focused coordinator/FLTK tests passed,
          and the full Linux application built and displayed a real example
          through a project-tab reload. The Windows package has been compiled
          and checked for required tools, runtime DLLs, notices, CRC and x64 PE
          signatures. This is **not a complete Windows GUI/runtime or numerical
          validation suite**. The repository screenshots are Linux captures,
          not Windows screenshots. Test on copies of your models and keep backups.

          Read `RISKS_AND_LIMITATIONS.md` inside the portable folder. Crashes,
          lost/corrupt work, incorrect inputs/results, missing external resources,
          unsafe conclusions and file compatibility problems remain possible.
          No flight-safety, airworthiness, top-speed or ceiling guarantee is made.

          The portable-folder layout and supporting executables are retained.

          ### Requirements
          Windows 10/11, 64-bit, with a compatible graphics driver. Microsoft
          runtime DLLs are included; if Windows reports a runtime problem, use
          Microsoft's official x64 Visual C++ Redistributable rather than
          downloading individual DLLs from third-party sites.

          ### License
          Distributed under the **NASA Open Source Agreement (NOSA) 1.3**, unchanged.
          This is a modified build; see `MODIFICATIONS.md` inside the archive.
          EOF

          cat >> notes.md <<EOF

          ### Exact source for this binary
          Built from commit **${GITHUB_SHA}**:
          https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}

          Matching source archive:
          https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.zip

          See \`QASP-BUILD-INFO.json\` inside the ZIP. When an existing release is
          updated, its original Git tag is not moved: GitHub's automatic
          tag-based source downloads may refer to the original, older source.
          Use the exact commit/archive linked above for the refreshed binary.
          EOF

          if [[ -n "$EXISTING_RELEASE" ]]; then
            NEWZIP=$(basename "$ZIPFILE")
            # Upload the new, uniquely source-named ZIP before touching old assets.
            gh release upload "$TAG" "$ZIPFILE" --repo "$GITHUB_REPOSITORY" --clobber
            VERIFY_DIR="$RUNNER_TEMP/qasp-release-verification"
            mkdir -p "$VERIFY_DIR"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$NEWZIP" --dir "$VERIFY_DIR" --clobber
            EXPECTED=$(sha256sum "$ZIPFILE" | cut -d' ' -f1)
            ACTUAL=$(sha256sum "$VERIFY_DIR/$NEWZIP" | cut -d' ' -f1)
            test "$EXPECTED" = "$ACTUAL"
            gh release upload "$TAG" dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
            # Retire older portable ZIPs only after the replacement was downloaded
            # and verified. Preserve the existing release ID, tag and title.
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            while IFS= read -r ASSET; do
              if [[ "$ASSET" == QASP-*-Windows-x64-portable_*.zip && "$ASSET" != "$NEWZIP" ]]; then
                gh release delete-asset "$TAG" "$ASSET" --yes --repo "$GITHUB_REPOSITORY"
              fi
            done
            echo "Updated existing release: $TAG (no new release or tag created)"
          else
            gh release create "$TAG" \
              --title "QASP ${TAG} (Windows x64 portable)" \
              --notes-file notes.md \
              --repo "$GITHUB_REPOSITORY" \
              dist/QASP-*.zip dist/SHA256SUMS.txt
          fi
